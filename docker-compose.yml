version: '3.8'

services:
  # MQTT Broker (Edge-to-Fog communication)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-mqtt
    ports:
      - "1883:1883"
      - "9083:9001"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # Redis (Alert escalation TTL tracking)
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # PostgreSQL with PostGIS (Spatio-temporal alert logging)
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: postgis-db
    environment:
      POSTGRES_USER: cctv_admin
      POSTGRES_PASSWORD: cctv_password
      POSTGRES_DB: cctv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Milvus Vector Database Dependencies
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=0
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  # Milvus Standalone Vector DB
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus-standalone
    command: ["milvus", "run", standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  # Attu (Milvus Web GUI for Facial Recognition System management)
  attu:
    image: zilliz/attu:v2.4.0
    container_name: milvus-attu
    environment:
      - MILVUS_URL=milvus:19530
    ports:
      - "8020:80"
    depends_on:
      - milvus
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  redis_data:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
